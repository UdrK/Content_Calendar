name: Build macOS App

on:
  workflow_dispatch: # Permette di avviare la compilazione a mano dalla scheda Actions di GitHub
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-macos:
    name: Build macOS Installer (.dmg / .zip)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --force --no-save @libsql/darwin-x64@0.4.7

      - name: Build macOS Application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disabilita la ricerca automatica di certificati Apple per evitare errori di Code Signing
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build
          npx electron-builder --mac -p never

      - name: Upload macOS Artifacts (.dmg and .zip)
        uses: actions/upload-artifact@v4
        with:
          name: Content-Calendar-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
